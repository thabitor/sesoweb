name: Build and deploy to Infomaniak

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infomaniak-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_CONTACT_SITE: https://sesoweb.vercel.app
      - run: cp deployments/infomaniak/.htaccess build/.htaccess
      - run: cp -R deployments/infomaniak/api build/api
      - uses: actions/upload-artifact@v4
        with:
          name: seso-infomaniak
          path: build/
          include-hidden-files: true

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' || vars.INFOMANIAK_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: infomaniak
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seso-infomaniak
          path: build
      - name: Upload website
        shell: bash
        env:
          SSH_HOST: ${{ secrets.INFOMANIAK_HOST }}
          SSH_USER: ${{ secrets.INFOMANIAK_USER }}
          SSH_KEY: ${{ secrets.INFOMANIAK_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.INFOMANIAK_KNOWN_HOSTS }}
          WEB_ROOT: ${{ secrets.INFOMANIAK_WEB_ROOT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing INFOMANIAK_HOST}"
          : "${SSH_USER:?Missing INFOMANIAK_USER}"
          : "${SSH_KEY:?Missing INFOMANIAK_SSH_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing INFOMANIAK_KNOWN_HOSTS}"
          : "${WEB_ROOT:?Missing INFOMANIAK_WEB_ROOT}"
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$WEB_ROOT" =~ ^/[a-zA-Z0-9_./-]+$ && "$WEB_ROOT" != / && "$WEB_ROOT" != *..* ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          export RSYNC_RSH='ssh -o BatchMode=yes -o StrictHostKeyChecking=yes'
          rsync -az --delay-updates --exclude index.html build/ "$SSH_USER@$SSH_HOST:$WEB_ROOT/"
          rsync -az build/index.html "$SSH_USER@$SSH_HOST:$WEB_ROOT/index.html"
